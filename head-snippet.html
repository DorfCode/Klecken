<!-- Favicons & app icons – paste into <head>. Files sit next to index.html. -->

<!-- Browser tabs (Chrome, Edge, Firefox, Safari): SVG first, PNG/ICO fallback -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-96x96.png" type="image/png" sizes="96x96">
<link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="icon" href="favicon.ico" sizes="48x48">

<!-- iPhone / iPad home screen, Safari favorites & bookmarks, macOS Dock web app -->
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<meta name="apple-mobile-web-app-title" content="Taktgefühl">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- Legacy Safari pinned tab (monochrome) -->
<link rel="mask-icon" href="safari-pinned-tab.svg" color="#00387B">

<!-- Android / Chrome "Add to Home screen", Windows/Edge install -->
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#00387B">

<!-- Windows tiles -->
<meta name="msapplication-TileColor" content="#00387B">
<meta name="msapplication-config" content="browserconfig.xml">
<meta name="application-name" content="Taktgefühl">
