<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klecken → Harburg</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }

  h1 {
    font-size: 1.2rem;
    margin: 0 0 4px;
  }

  #stand {
    font-size: .8rem;
    opacity: .7;
    margin-bottom: 12px;
  }

  .zug {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 10px;
    border: 1px solid #8884;
  }

  .zug > div:first-child {
    flex: 1 1 auto;
    min-width: 0;
  }

  .zeit {
    font-size: 1.6rem;
    font-weight: 600;
    line-height: 1.1;
  }

  .ziel {
    font-size: .85rem;
    opacity: .8;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }

  .status-box {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    text-align: right;
    min-width: 110px;
    margin-left: 8px;
  }

  .status-text {
    font-weight: 700;
    white-space: nowrap;
    line-height: 1.3;
  }

  .grund {
    font-size: .72rem;
    opacity: .8;
    line-height: 1.3;
    margin-top: 2px;
    max-width: 140px;
  }

  .puenktlich { color: #1a8f3c; }
  .spaet { color: #d97706; }
  .ausfall { color: #dc2626; }

  .zug.ausfall-box { opacity: .7; }

  #fehler {
    color: #dc2626;
    white-space: pre-wrap;
  }

  button {
    margin-top: 8px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #8886;
    background: none;
    color: inherit;
  }
</style>

<script data-goatcounter="https://dorfcodemetronom.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <h1>Klecken → Harburg</h1>
  <div id="stand">Lade …</div>
  <div id="liste"></div>
  <div id="fehler"></div>
  <button onclick="laden()">Aktualisieren</button>

<script>
const STATION = "Klecken";
const URL_API = "https://dbf.finalrewind.org/" + encodeURIComponent(STATION)
              + "?version=3&mode=json&admode=dep&limit=12";
const ZIEL_FILTER = /harburg|hamburg/i;

function minuten(zeit) {
  const [h, m] = String(zeit).split(":").map(Number);
  return h * 60 + m;
}

function grundFuerZug(d) {
  const keys = [
    "reason",
    "delayReason",
    "reasonText",
    "delayText",
    "statusText",
    "message",
    "notes",
    "remark",
    "cancelReason",
    "comment",
    "description"
  ];

  for (const key of keys) {
    const v = d[key];
    if (typeof v === "string" && v.trim()) return v.trim();
  }

  const nested = [
    d?.details?.reason,
    d?.details?.delayReason,
    d?.details?.text,
    d?.meta?.reason,
    d?.meta?.message
  ];

  for (const v of nested) {
    if (typeof v === "string" && v.trim()) return v.trim();
  }

  return "";
}

function zeigeZug(d) {
  const geplant = d.scheduledDeparture || d.scheduledArrival || "";
  const verspaetung = d.delayDeparture ?? d.delayArrival ?? 0;
  const ausgefallen = d.isCancelled || d.isCancelled === 1;
  const grund = grundFuerZug(d);

  let klasse = "puenktlich", text = "pünktlich";
  if (ausgefallen) {
    klasse = "ausfall";
    text = "fällt aus";
  } else if (verspaetung > 0) {
    klasse = "spaet";
    text = "+" + verspaetung + " min";
  }

  let tatsaechlich = "";
  if (!ausgefallen && verspaetung > 0 && /^\d{1,2}:\d{2}$/.test(geplant)) {
    const t = (minuten(geplant) + verspaetung) % 1440;
    tatsaechlich = String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
  }

  const el = document.createElement("div");
  el.className = "zug" + (ausgefallen ? " ausfall-box" : "");

  const grundHtml = (grund && (verspaetung > 0 || ausgefallen))
    ? '<div class="grund">Grund: ' + grund + '</div>'
    : "";

  const abHtml = tatsaechlich
    ? '<div class="grund">ab ' + tatsaechlich + '</div>'
    : "";

  el.innerHTML =
    '<div>' +
      '<div class="zeit">' + geplant + '</div>' +
      '<div class="ziel">' +
        (d.train || d.line || "") + ' → ' + (d.destination || "") +
        (d.platform ? ' · Gl. ' + d.platform : '') +
      '</div>' +
    '</div>' +
    '<div class="status-box">' +
      '<div class="status-text ' + klasse + '">' + text + '</div>' +
      grundHtml +
      abHtml +
    '</div>';

  return el;
}

async function laden() {
  const liste = document.getElementById("liste");
  const fehler = document.getElementById("fehler");
  const stand = document.getElementById("stand");
  fehler.textContent = "";

  try {
    const antwort = await fetch(URL_API);
    if (!antwort.ok) throw new Error("HTTP " + antwort.status);
    const daten = await antwort.json();
    if (daten.error) throw new Error(daten.error);

    let abfahrten = daten.departures || [];

    const gefiltert = abfahrten.filter(d =>
      ZIEL_FILTER.test(d.destination || "") ||
      (d.via || []).some(v => ZIEL_FILTER.test(typeof v === "string" ? v : (v.name || "")))
    );

    if (gefiltert.length) abfahrten = gefiltert;

    liste.innerHTML = "";
    if (!abfahrten.length) {
      liste.textContent = "Keine Abfahrten gefunden.";
    } else {
      abfahrten.slice(0, 6).forEach(d => liste.appendChild(zeigeZug(d)));
    }

    stand.textContent = "Stand: " + new Date().toLocaleTimeString("de-DE");
  } catch (e) {
    stand.textContent = "Fehler beim Laden";
    fehler.textContent = e.message +
      "\n\nFalls hier 'Failed to fetch' steht, blockiert vermutlich CORS die Anfrage " +
      "(Details in der Browser-Konsole, F12).";
  }
}

laden();
setInterval(laden, 60000);
</script>
</body>
</html>
